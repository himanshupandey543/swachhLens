# Netlify Configuration for SwachLens Frontend

[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

# SPA-style routing: serve .html files for clean URLs
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/user"
  to = "/user.html"
  status = 200

[[redirects]]
  from = "/employee"
  to = "/employee.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

# Catch-all: serve index.html for other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
